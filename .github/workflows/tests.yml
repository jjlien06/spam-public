name: Public alpha checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]' pytest-xdist
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q job_agent
      - name: Local fixtures and mocked integrations (no model download)
        env:
          SPAM_HOME: ${{ runner.temp }}/spam-test-home
        run: >-
          python -m pytest -q -n 4 tests --durations=15
          --deselect=tests/test_decisions.py::test_local_laya_chooses_bounded_next_on_two_step_fixture_without_submit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --silent --show-error -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          assert hashlib.sha256(Path('gitleaks.tar.gz').read_bytes()).hexdigest() == expected
          PY
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact=100 --no-banner
